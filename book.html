<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>作品详情 - 书间</title>
  <meta name="description" content="">
  
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css?v=commentfix-20261112">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#d4a574">
</head>
<body>
  <div class="navbar">
    <h1><a href="/">书间</a></h1>
    <nav>
      <a href="/auth.html" id="nav-auth">登录 / 注册</a>
      <a href="/admin.html" id="nav-admin" style="display:none">管理</a>
      <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">🌙</button>
    </nav>
  </div>
  <div class="container">
    <div class="breadcrumb"><a href="/">书架</a><span>›</span><span id="bc-title">加载中...</span></div>
    <div id="content" class="loading">加载中...</div>
  </div>
  <script>

    const bookId = new URLSearchParams(location.search).get('id');
    let allChapters = [];
    if (!bookId || !/^\d+$/.test(bookId)) {
      document.getElementById('content').innerHTML = '<div class="msg msg-error">无效的书籍ID</div>';
    } else {
      loadBook();
    }

    // 加载站点设置
    fetch('/api/settings').then(r => r.json()).then(d => {
      const s = d.settings || {};
      if (s.site_name) document.querySelector('.navbar h1 a').textContent = s.site_name;
    }).catch(() => {});

    fetch('/api/me?fresh=' + Date.now(), { credentials: 'same-origin', cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(user => {
      if (!user) return;
      const auth = document.getElementById('nav-auth');
      const admin = document.getElementById('nav-admin');
      auth.href = '/profile.html';
      auth.textContent = '个人主页';
      if (['super_admin', 'admin', 'demo'].includes(user.role)) admin.style.display = '';
    }).catch(() => {});

    // PWA Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', event => {
        if (event.data?.type === 'app-updated') location.reload();
      });
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    async function loadBook() {
      const el = document.getElementById('content');
      try {
        const res = await fetch(`/api/books/${bookId}`);
        if (!res.ok) throw new Error(res.status === 404 ? '书籍不存在' : '加载失败');
        const data = await res.json();
        const b = data.book;
        const chapters = data.chapters || [];
        allChapters = chapters;

        document.title = esc(b.title) + ' - 书间';
        document.querySelector('meta[name="description"]').content = b.description || b.title;
        document.getElementById('bc-title').textContent = b.title;

        const tagsHtml = (b.tags || []).map(t => `<a class="tag-pill book-tag-link" href="/category.html?id=${t.id}" style="--category-color:${esc(t.color)}">${esc(t.name)}</a>`).join('');
        const tagsBlock = tagsHtml ? `<div class="book-tags">${tagsHtml}</div>` : '';

        const uploaderHtml = b.uploader ? `<div class="uploader" style="font-size:13px;color:var(--text-light);margin-top:4px">${b.uploader_avatar ? '<img src="'+esc(b.uploader_avatar)+'" style="width:16px;height:16px;border-radius:50%;vertical-align:middle;margin-right:3px">' : ''}上传：${esc(b.uploader)}</div>` : '';

        const likeButton = `<button class="book-like-btn ${b.liked ? 'liked' : ''}" id="book-like" aria-pressed="${!!b.liked}"><span class="book-like-icon" aria-hidden="true">${b.liked ? '♥' : '♡'}</span><span class="book-like-label">${b.liked ? '已喜欢' : '喜欢'}</span><span class="book-like-count">${b.like_count || 0}</span></button>`;
        let html;
        if (b.cover_key) {
          html = `
            <div class="book-header">
              <div class="book-header-with-cover">
                <img class="book-cover-img" src="/api/covers/${b.id}" alt="${esc(b.title)}">
                <div class="book-info">
                  <div class="book-title-row"><h2>${esc(b.title)}</h2>${likeButton}</div>
                  ${b.author ? `<div class="author">作者：${esc(b.author)}</div>` : ''}
                  ${uploaderHtml}
                  ${b.description ? `<div class="desc">${cleanDesc(b.description)}</div>` : ''}
                  ${tagsBlock}
                </div>
              </div>
            </div>
          `;
        } else {
          html = `
            <div class="book-header">
              <div class="book-title-row"><h2>${esc(b.title)}</h2>${likeButton}</div>
              ${b.author ? `<div class="author">作者：${esc(b.author)}</div>` : ''}
              ${uploaderHtml}
              ${b.description ? `<div class="desc">${cleanDesc(b.description)}</div>` : ''}
              ${tagsBlock}
            </div>
          `;
        }
        if (chapters.length > 0) {
          html += `<div class="search-bar" style="margin-top:16px;margin-bottom:0"><input type="text" id="chapter-search" placeholder="搜索章节标题..." autocomplete="off"><button onclick="filterChapters()">搜索</button></div>`;
        }
        if (chapters.length === 0) {
          html += '<div class="empty"><p>暂无章节</p></div>';
        } else {
          // P2修复：大量章节时分页加载，每页50章
          const CHAPTERS_PER_PAGE = 50;
          const needsPagination = chapters.length > CHAPTERS_PER_PAGE;
          
          html += '<ul class="chapter-list" id="chapter-list">';
          // 首次只渲染第一页
          const initialChapters = needsPagination ? chapters.slice(0, CHAPTERS_PER_PAGE) : chapters;
          html += initialChapters.map(c => `
            <li>
              <a href="/read.html?id=${c.id}">
                <span class="chapter-title">${esc(c.title)}</span>
                <span class="chapter-meta">${c.word_count} 字</span>
              </a>
            </li>
          `).join('');
          html += '</ul>';
          
          // 分页控制
          if (needsPagination) {
            const totalPages = Math.ceil(chapters.length / CHAPTERS_PER_PAGE);
            html += `<div class="chapter-pagination" id="chapter-pagination" data-page="1" data-per-page="${CHAPTERS_PER_PAGE}" data-total="${chapters.length}">
              <button id="ch-prev" disabled>上一页</button>
              <span class="page-info">第 <span id="ch-current">1</span> / ${totalPages} 页（共 ${chapters.length} 章）</span>
              <button id="ch-next">下一页</button>
            </div>`;
          }
          
          html += `<div style="margin-top:20px;text-align:center"><a href="#" id="export-link" style="font-size:13px;color:var(--text-light);text-decoration:none;border-bottom:1px dashed var(--text-light);padding-bottom:1px">导出全书 TXT</a></div>`;
        }

        // 书签列表
        const bookmarks = getBookmarks(bookId);
        if (bookmarks.length > 0) {
          html += `<div style="margin-top:24px"><h3 style="font-size:16px;margin-bottom:12px;color:var(--text)">🔖 我的书签（${bookmarks.length}）</h3>`;
          html += '<ul class="chapter-list">' + bookmarks.sort((a,b) => b.time - a.time).map(bm => `
            <li>
              <a href="/read.html?id=${bm.chapterId}">
                <span class="chapter-title">${esc(bm.chapterTitle)}</span>
                <span class="chapter-meta">${formatTimeAgo(bm.time)}</span>
              </a>
            </li>
          `).join('') + '</ul></div>';
        }

        el.innerHTML = html;
        // 评论区（每次渲染书籍后重新加载）
        renderCommentSection(el, b.id);

        const likeEl = document.getElementById('book-like');
        if (likeEl) likeEl.addEventListener('click', async () => {
          likeEl.disabled = true;
          try {
            const likeRes = await fetch(`/api/books/${b.id}/like`, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } });
            const likeData = await likeRes.json();
            if (!likeRes.ok) throw new Error(likeData.error || '请先登录');
            likeEl.classList.toggle('liked', likeData.liked);
            likeEl.setAttribute('aria-pressed', likeData.liked);
            likeEl.querySelector('.book-like-icon').textContent = likeData.liked ? '♥' : '♡';
            likeEl.querySelector('.book-like-label').textContent = likeData.liked ? '已喜欢' : '喜欢';
            likeEl.querySelector('.book-like-count').textContent = likeData.likeCount;
          } catch (error) { alert(error.message); } finally { likeEl.disabled = false; }
        });

        // 安全绑定导出事件（避免onclick中拼接字符串）
        const exportLink = document.getElementById('export-link');
        if (exportLink) {
          exportLink.addEventListener('click', (e) => { e.preventDefault(); exportBook(b.id, b.title, b.author); });
        }
        
        // P2修复：绑定章节分页事件
        bindChapterPagination();
      } catch (e) {
        el.innerHTML = `<div class="msg msg-error">${esc(e.message)}</div>`;
      }
    }
    // ===== 评论区 =====
    let commentState = { page: 1, total: 0, hasMore: false, loggedIn: false, loading: false, bookId: null };

    function renderCommentSection(container, bookId) {
      commentState = { page: 1, total: 0, hasMore: false, loggedIn: false, loading: false, bookId };
      const section = document.createElement('section');
      section.className = 'comment-section';
      section.id = 'comment-section';
      section.innerHTML = `
        <div class="comment-head">
          <h3 class="comment-title">评论 <span class="comment-count" id="comment-count">0</span></h3>
        </div>
        <div id="comment-composer"></div>
        <div id="comment-list" class="comment-list"><div class="comment-empty">加载中…</div></div>
        <div id="comment-more-wrap" style="display:none">
          <button class="btn comment-more" id="comment-more">加载更多评论</button>
        </div>
        <div id="comment-msg" class="comment-msg"></div>
      `;
      container.appendChild(section);
      loadComments(bookId, 1, false);
    }

    async function loadComments(bookId, page, append, opts) {
      const listEl = document.getElementById('comment-list');
      if (!listEl) return;
      const force = !!(opts && opts.force);
      if (commentState.loading && !force) return;
      if (force) commentState.loading = false;
      commentState.loading = true;
      if (!append) listEl.innerHTML = '<div class="comment-empty">加载中…</div>';
      try {
        const res = await fetch(`/api/comments?bookId=${encodeURIComponent(bookId)}&page=${page}`, {
          credentials: 'same-origin', cache: 'no-store'
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '加载失败');

        commentState.total = data.total || 0;
        commentState.hasMore = !!data.hasMore;
        commentState.loggedIn = !!data.loggedIn;
        commentState.page = page;

        const countEl = document.getElementById('comment-count');
        if (countEl) countEl.textContent = commentState.total;

        renderComposer(commentState.loggedIn);

        const comments = data.comments || [];
        if (!append) listEl.innerHTML = '';
        if (!comments.length && !append) {
          listEl.innerHTML = '<div class="comment-empty">还没有评论，来说两句吧。</div>';
        } else {
          listEl.insertAdjacentHTML('beforeend', comments.map(renderCommentItem).join(''));
        }

        const moreWrap = document.getElementById('comment-more-wrap');
        if (moreWrap) moreWrap.style.display = commentState.hasMore ? '' : 'none';
        bindCommentActions();
      } catch (e) {
        if (!append) listEl.innerHTML = `<div class="comment-empty comment-error">${esc(e.message)}</div>`;
      } finally {
        commentState.loading = false;
      }
    }

    function renderComposer(loggedIn) {
      const el = document.getElementById('comment-composer');
      if (!el) return;
      if (!loggedIn) {
        el.innerHTML = `<div class="comment-login-hint">
          登录后即可参与评论
          <a href="/auth.html" class="comment-login-link">登录 / 注册</a>
        </div>`;
        return;
      }
      el.innerHTML = `
        <div class="comment-composer">
          <textarea id="comment-input" maxlength="500" placeholder="写下你对这本书的看法…" rows="3"></textarea>
          <div class="comment-composer-foot">
            <span class="comment-char"><span id="comment-char-num">0</span>/500</span>
            <button class="btn comment-submit" id="comment-submit" type="button">发表评论</button>
          </div>
        </div>
      `;
      const input = document.getElementById('comment-input');
      const submit = document.getElementById('comment-submit');
      input.addEventListener('input', () => {
        document.getElementById('comment-char-num').textContent = input.value.length;
        document.querySelector('.comment-char').classList.toggle('warn', input.value.length > 450);
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitComment(); }
      });
      submit.addEventListener('click', submitComment);
    }

    function renderCommentItem(c) {
      const roleLabel = { super_admin: '超管', admin: '管理', demo: '演示', reader: '读者' }[c.role] || '读者';
      const roleCls = ['super_admin', 'admin', 'demo'].includes(c.role) ? ' comment-role-admin' : '';
      const avatar = c.avatarUrl
        ? `<img class="comment-avatar" src="${esc(c.avatarUrl)}" alt="">`
        : `<span class="comment-avatar comment-avatar-fallback">${esc((c.username || '?')[0])}</span>`;
      return `<article class="comment-item" data-comment-id="${c.id}">
        ${avatar}
        <div class="comment-body">
          <div class="comment-meta">
            <span class="comment-author">${esc(c.username || '匿名')}</span>
            ${['super_admin','admin','demo'].includes(c.role) ? `<span class="comment-role-badge${roleCls}">${roleLabel}</span>` : ''}
            <time class="comment-time">${formatCommentTime(c.createdAt)}</time>
            ${c.canDelete ? `<button class="comment-delete" data-delete-id="${c.id}" type="button">删除</button>` : ''}
          </div>
          <div class="comment-text">${esc(c.content)}</div>
        </div>
      </article>`;
    }

    function formatCommentTime(v) {
      if (!v) return '';
      // SQLite datetime('now') 为 UTC，补 Z 以正确解析
      const iso = /Z|[+-]\d{2}:?\d{2}$/.test(v) ? v : v.replace(' ', 'T') + 'Z';
      const t = new Date(iso).getTime();
      if (isNaN(t)) return esc(String(v));
      const diff = Date.now() - t;
      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
      if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
      if (diff < 604800000) return Math.floor(diff / 86400000) + ' 天前';
      return new Date(t).toLocaleDateString('zh-CN');
    }

    function bindCommentActions() {
      const more = document.getElementById('comment-more');
      if (more && !more.dataset.bound) {
        more.dataset.bound = '1';
        more.addEventListener('click', () => loadComments(commentState.bookId, commentState.page + 1, true));
      }
    }

    async function submitComment() {
      const input = document.getElementById('comment-input');
      const btn = document.getElementById('comment-submit');
      if (!input || !btn) return;
      const content = input.value.trim();
      const msg = document.getElementById('comment-msg');
      if (!content) { msg.textContent = '评论内容不能为空'; msg.className = 'comment-msg is-error'; return; }
      btn.disabled = true;
      btn.textContent = '发表中…';
      try {
        const res = await fetch('/api/comments', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ bookId: commentState.bookId, content })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '发表失败');
        input.value = '';
        document.getElementById('comment-char-num').textContent = '0';
        msg.textContent = '评论已发表';
        msg.className = 'comment-msg is-success';
        await loadComments(commentState.bookId, 1, false);
        setTimeout(() => { msg.textContent = ''; msg.className = 'comment-msg'; }, 2500);
      } catch (e) {
        msg.textContent = e.message;
        msg.className = 'comment-msg is-error';
      } finally {
        btn.disabled = false;
        btn.textContent = '发表评论';
      }
    }

    // 评论删除（事件委托，支持后续动态插入）
    document.addEventListener('click', async (e) => {
      const del = e.target.closest('.comment-delete');
      if (!del) return;
      e.preventDefault();
      e.stopPropagation();
      const id = del.dataset.deleteId;
      if (!id) return;
      if (!confirm('确定删除这条评论？')) return;
      del.disabled = true;
      del.textContent = '删除中…';
      try {
        const res = await fetch(`/api/comments?id=${encodeURIComponent(id)}`, {
          method: 'DELETE',
          credentials: 'same-origin',
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache' }
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || '删除失败');

        // 立即从 DOM 移除该项，不等重新请求，避免视觉延迟
        const item = del.closest('.comment-item');
        if (item) item.remove();
        // 同步计数
        commentState.total = Math.max(0, commentState.total - 1);
        const countEl = document.getElementById('comment-count');
        if (countEl) countEl.textContent = commentState.total;

        // 列表空了就显示空态
        const listEl = document.getElementById('comment-list');
        if (listEl && !listEl.querySelector('.comment-item')) {
          listEl.innerHTML = '<div class="comment-empty">还没有评论，来说两句吧。</div>';
        }

        // 再与服务器对齐一次（保证分页与 hasMore 正确）
        await loadComments(commentState.bookId, 1, false, { force: true });
      } catch (err) {
        alert(err.message);
        del.disabled = false;
        del.textContent = '删除';
      }
    });

    function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
    function cleanDesc(s) {
      if (!s) return '';
      if (!/<[a-z][\s\S]*>/i.test(s)) return esc(s);
      const doc = new DOMParser().parseFromString('<body>' + s + '</body>', 'text/html').body;
      doc.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
      const parts = [];
      doc.querySelectorAll('p, div, li').forEach(b => { const t = b.textContent.trim(); if (t) parts.push(esc(t)); });
      return parts.length > 0 ? parts.join('<br>') : esc(doc.textContent.trim());
    }

    function getBookmarks(bookId) {
      try { return JSON.parse(localStorage.getItem(`bookmarks_${bookId}`)) || []; }
      catch { return []; }
    }
    function formatTimeAgo(ts) {
      const diff = Date.now() - ts;
      const min = Math.floor(diff / 60000);
      if (min < 1) return '刚刚';
      if (min < 60) return min + '分钟前';
      const hr = Math.floor(min / 60);
      if (hr < 24) return hr + '小时前';
      return Math.floor(hr / 24) + '天前';
    }

    function filterChapters() {
      const input = document.getElementById('chapter-search');
      if (!input) return;
      const q = input.value.trim().toLowerCase();
      const listEl = document.querySelector('.chapter-list');
      if (!listEl) return;
      const filtered = q ? allChapters.filter(c => c.title.toLowerCase().includes(q)) : allChapters;
      if (filtered.length === 0) {
        listEl.innerHTML = '<li style="padding:16px;text-align:center;color:var(--text-light)">没有匹配的章节</li>';
      } else {
        listEl.innerHTML = filtered.map(c => `
          <li><a href="/read.html?id=${c.id}">
            <span class="chapter-title">${highlightMatch(esc(c.title), q)}</span>
            <span class="chapter-meta">${c.word_count} 字</span>
          </a></li>
        `).join('');
      }
    }
    function highlightMatch(text, q) {
      if (!q) return text;
      const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
      return text.replace(re, '<mark>$1</mark>');
    }
    // 绑定搜索事件（DOM加载后立即执行，避免竞态条件）
    function bindSearchEvents() {
      const searchInput = document.getElementById('chapter-search');
      if (searchInput) {
        searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') filterChapters(); });
        searchInput.addEventListener('input', (e) => { if (!e.target.value.trim()) filterChapters(); });
      }
    }
    // 如果DOM已加载完成，立即绑定；否则等待DOMContentLoaded
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bindSearchEvents);
    } else {
      bindSearchEvents();
    }

    // P2修复：章节分页控制
    function bindChapterPagination() {
      const pagination = document.getElementById('chapter-pagination');
      if (!pagination) return;
      
      const prevBtn = document.getElementById('ch-prev');
      const nextBtn = document.getElementById('ch-next');
      const currentSpan = document.getElementById('ch-current');
      const perPage = parseInt(pagination.dataset.perPage);
      const total = parseInt(pagination.dataset.total);
      const totalPages = Math.ceil(total / perPage);
      
      prevBtn.addEventListener('click', () => {
        let page = parseInt(pagination.dataset.page);
        if (page > 1) {
          page--;
          renderChapterPage(page, perPage, total, totalPages);
          pagination.dataset.page = page;
          currentSpan.textContent = page;
          prevBtn.disabled = page === 1;
          nextBtn.disabled = false;
        }
      });
      
      nextBtn.addEventListener('click', () => {
        let page = parseInt(pagination.dataset.page);
        if (page < totalPages) {
          page++;
          renderChapterPage(page, perPage, total, totalPages);
          pagination.dataset.page = page;
          currentSpan.textContent = page;
          nextBtn.disabled = page === totalPages;
          prevBtn.disabled = false;
        }
      });
    }

    function renderChapterPage(page, perPage, total, totalPages) {
      const listEl = document.getElementById('chapter-list');
      if (!listEl) return;
      
      const start = (page - 1) * perPage;
      const end = Math.min(start + perPage, total);
      const pageChapters = allChapters.slice(start, end);
      
      listEl.innerHTML = pageChapters.map(c => `
        <li><a href="/read.html?id=${c.id}">
          <span class="chapter-title">${esc(c.title)}</span>
          <span class="chapter-meta">${c.word_count} 字</span>
        </a></li>
      `).join('');
      
      // 滚动到章节列表顶部
      listEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    async function exportBook(bookId, title, author) {
      try {
        const res = await fetch(`/api/books/${bookId}`);
        const data = await res.json();
        const chapters = data.chapters || [];
        if (chapters.length === 0) return alert('没有章节可导出');
        
        // 使用流式处理避免大文件内存溢出
        const CHUNK_SIZE = 100; // 每次处理的章节数
        const sep = '\n\n' + '='.repeat(40) + '\n\n';
        const header = `《${title}》\n${author ? '作者：'+author+'\n' : ''}\n`;
        const BOM = '\uFEFF';
        
        // 创建可写流
        const chunks = [BOM + header];
        let processedCount = 0;
        
        // 分块处理章节，避免一次性加载所有内容到内存
        for (let i = 0; i < chapters.length; i += CHUNK_SIZE) {
          const batch = chapters.slice(i, i + CHUNK_SIZE);
          const batchPromises = batch.map(async (ch) => {
            const r = await fetch(`/api/chapters/${ch.id}`);
            const d = await r.json();
            return ch.title + '\n\n' + d.content;
          });
          const batchResults = await Promise.all(batchPromises);
          
          // 添加分隔符
          if (processedCount > 0) {
            chunks.push(sep);
          }
          chunks.push(...batchResults);
          processedCount += batchResults.length;
          
          // 让出主线程，保持UI响应
          await new Promise(resolve => setTimeout(resolve, 0));
        }
        
        // 使用 Blob 构造函数的分块模式，减少内存峰值
        const blob = new Blob(chunks, {type:'text/plain;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (title + (author ? '_'+author : '') + '.txt').replace(/[<>:"/\\|?*]/g,'_');
        a.click();
        URL.revokeObjectURL(url);
      } catch (e) { alert('导出失败：'+e.message); }
    }
  </script>
</body>
</html>
